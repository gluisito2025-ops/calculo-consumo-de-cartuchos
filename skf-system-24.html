
<script>
(function(){
const META='__skf_shared_meta__';
let remoteReady=false,sharedImage=localStorage.getItem('skf-image')||'',timer;
const localState=()=>{try{const raw=localStorage.getItem('skf-real-data')||localStorage.getItem(KEY);const value=raw?JSON.parse(raw):null;return Array.isArray(value)?value.filter(item=>item&&item.af):null}catch(error){return null}};
const persistLocal=()=>{const value=JSON.stringify(data);localStorage.setItem(KEY,value);localStorage.setItem('skf-real-data',value)};
const pushState=async()=>{if(!remoteReady)return;const equipment=data.filter(item=>item&&item.__skf_shared_meta!==true);if(sharedImage)equipment.push({__skf_shared_meta:META,image:sharedImage});try{await fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({equipment})})}catch(error){console.warn('No se pudo sincronizar el estado compartido:',error)}};
const schedule=()=>{clearTimeout(timer);timer=setTimeout(pushState,300)};
const applyImage=image=>{if(!image)return;sharedImage=image;localStorage.setItem('skf-image',image);$('productImage').src=image;$('hero').classList.add('has-image')};
const ensureDateFilter=()=>{if(!$('dateFilter')){const input=document.createElement('input');input.id='dateFilter';input.type='hidden';document.body.append(input)}};
const previousRender=window.render;
window.render=function(){ensureDateFilter();previousRender();const all=data.map(item=>window.calc(item));$('upcoming').textContent=all.filter(item=>item.left<=60&&item.left>0).length;const label=$('upcoming')?.nextElementSibling;if(label)label.textContent='En los próximos 60 días'};
const foot=document.querySelector('.side-foot');if(foot)foot.innerHTML='BOGOTÁ<br>Lavandería Industrial<br><br><span class="good">● Sistema operativo</span><br>Sincronización remota activa';
document.addEventListener('input',event=>{if(event.target.closest('#rows')){persistLocal();schedule()}});
document.addEventListener('change',event=>{if(event.target.closest('#rows')){persistLocal();schedule()}});
document.addEventListener('click',event=>{if(event.target.closest('#rows'))setTimeout(()=>{persistLocal();schedule()},0)});
document.addEventListener('submit',()=>setTimeout(()=>{persistLocal();schedule()},0),true);
$('imageInput')?.addEventListener('change',event=>{const file=event.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{applyImage(reader.result);schedule()};reader.readAsDataURL(file)});
(async()=>{try{const response=await fetch('/api/state',{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);const payload=await response.json();const remote=Array.isArray(payload.equipment)?payload.equipment:[];const meta=remote.find(item=>item&&item.__skf_shared_meta===META);const remoteData=remote.filter(item=>!item||item.__skf_shared_meta!==META);const local=localState();if(remoteData.length){data=remoteData;persistLocal()}else if(local?.length){data=local;persistLocal()}if(meta?.image)applyImage(meta.image);remoteReady=true;await pushState();window.render()}catch(error){console.warn('Se usara la copia local temporalmente:',error);remoteReady=false;window.render()}})();
})();
</script>
